<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>National Park Images Taken by Me</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <nav>
                <a href="index.html">Home</a>
                <a href="gallery.html">Gallery</a>
            </nav>

            <header>
                <h1>National Park Image Gallery</h1>
                <p>Photos from my trips</p>
            </header>

            <section>
                <h2>Yellowstone</h2>
                <div class="gallery">
                    <figure>
                        <a href="images/gallery/MAMMOTH_HOT_SPRING.jpg" target="_blank">
                            <img src="images/gallery/MAMMOTH_HOT_SPRING.jpg" alt="Mammoth Hot Springs at Yellowstone NP" loading="lazy" />
                        </a>
                        <figcaption>Mammoth Hot Springs</figcaption>
                    </figure>
                    <figure>
                        <a href="images/gallery/GRAND_VIEW_CANYON_YSTONE.jpg" target="_blank">
                            <img src="images/gallery/GRAND_VIEW_CANYON_YSTONE.jpg" alt="Grand View of Grand Canyon of Yellowstone at Yellowstone NP" loading="lazy" />
                        </a>
                        <figcaption>Grand Canyon of the Yellowstone</figcaption>
                    </figure>
                    <figure>
                        <a href="images/gallery/GRAND_PRISMATIC.jpg" target="_blank">
                            <img src="images/gallery/GRAND_PRISMATIC.jpg" alt="Grand Prismatic Spring at Yellowstone NP" loading="lazy" />
                        </a>
                        <figcaption>Grand Prismatic Spring</figcaption>
                    </figure>
                </div>
            </section>
            <section>
                <h2>Grand Teton</h2>
                <div class="gallery">
                    <figure>
                        <a href="images/gallery/JENNY_LAKE.jpg" target="_blank">
                            <img src="images/gallery/JENNY_LAKE.jpg" alt="Jenny Lake at Grand Teton NP" loading="lazy" />
                        </a>
                        <figcaption>Jenny Lake</figcaption>
                    </figure>
                    <figure>
                        <a href="images/gallery/ELK_RANCH_FLATS.jpg" target="_blank">
                            <img src="images/gallery/ELK_RANCH_FLATS.jpg" alt="Elk Ranch Flats at Grand Teton NP" loading="lazy" />
                        </a>
                        <figcaption>Elk Ranch Flats</figcaption>
                    </figure>
                </div>
            </section>
        </div>
    </body>
</html>
